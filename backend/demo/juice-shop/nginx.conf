# Hardening OWASP Juice Shop at the edge.
#
# The application is deliberately vulnerable and we are not patching it. This is
# the remediation PatchPilot recommends when the finding cannot be fixed in the
# app itself: put something in front that can set headers and refuse paths.

server {
    listen 8080;
    server_name _;

    # The first hardening pass introduced this: nginx advertises its exact
    # version, which the rescan flagged. Suppress it.
    server_tokens off;

    # Headers the application does not send.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The app sends "Access-Control-Allow-Origin: *". Drop it and do not
    # re-add one: nothing here is meant to be read cross-origin.
    proxy_hide_header Access-Control-Allow-Origin;

    # Exposures the scan found. Neither belongs on the public interface.
    location /ftp     { return 403; }
    location /metrics { return 403; }

    location / {
        proxy_pass http://juiceshop:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
